<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Almacén · Picking</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #111827; font-family: 'Inter', system-ui, sans-serif; color: #f9fafb; min-height: 100vh; }

  .header {
    background: #1f2937; padding: 14px 16px;
    border-bottom: 2px solid #374151;
    position: sticky; top: 0; z-index: 10;
  }
  .header-row { display:flex; align-items:center; gap:10px; }
  .header-icon { width:40px; height:40px; border-radius:10px; background:#2563eb; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  .header-title { font-weight:900; font-size:20px; color:#ffffff; }
  .header-sub { color:#9ca3af; font-size:13px; margin-top:2px; }
  .btn-refresh { background:#374151; border:none; border-radius:8px; padding:9px 14px; color:#e5e7eb; cursor:pointer; font-size:14px; font-weight:600; }
  .btn-refresh:active { opacity:0.7; }
  .btn-back { background:none; border:none; color:#60a5fa; font-size:30px; cursor:pointer; padding:0 4px 0 0; line-height:1; flex-shrink:0; }
  .pedido-num-big { color:#ffffff; font-size:28px; font-weight:900; letter-spacing:-1px; line-height:1; }
  .pedido-semana-big { color:#60a5fa; font-size:22px; font-weight:800; margin-top:2px; }

  .progress-wrap { height:5px; background:#374151; border-radius:3px; margin-top:12px; overflow:hidden; }
  .progress-bar { height:100%; border-radius:3px; transition: width 0.3s ease; }

  .badge { border-radius:8px; padding:4px 10px; font-size:12px; font-weight:800; white-space:nowrap; }
  .badge-listo   { background:#16a34a; color:#fff; }
  .badge-parcial { background:#d97706; color:#fff; }
  .badge-pend    { background:#374151; color:#9ca3af; }

  .content { padding:14px 12px; display:flex; flex-direction:column; gap:10px; }
  .content.grid-arts { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }

  /* PEDIDO */
  .pedido-btn {
    background:#1f2937; border:2px solid #374151; border-radius:14px;
    padding:16px; text-align:left; cursor:pointer;
    display:flex; align-items:center; gap:14px; width:100%;
  }
  .pedido-btn.listo { border-color:#16a34a; background:#052e1633; }
  .pedido-btn:active { opacity:0.8; }
  .pedido-icon { width:46px; height:46px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; background:#111827; }
  .pedido-num  { color:#93c5fd; font-size:13px; font-weight:700; letter-spacing:1.5px; }
  .pedido-name { color:#ffffff; font-weight:800; font-size:20px; line-height:1.2; margin-top:2px; }
  .pedido-sub  { color:#6b7280; font-size:13px; margin-top:4px; }

  /* ARTÍCULO nivel 3 */
  .art-card {
    background:#1f2937; border:2px solid #374151; border-radius:14px;
    overflow:hidden; transition: border-color 0.15s;
  }
  .art-card.done { border-color:#16a34a; background:#052e1620; }

  /* Imagen grande arriba */
  .art-img-wrap {
    width:100%; aspect-ratio:4/3; background:#111827; position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .art-prod-img {
    width:100%; height:100%; object-fit:contain; display:block;
  }
  .art-prod-img-placeholder {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-size:56px; color:#374151;
  }
  .art-done-overlay {
    position:absolute; top:10px; right:10px;
    background:#16a34a; border-radius:8px;
    padding:4px 10px; font-size:13px; font-weight:800; color:#fff;
  }

  /* Info debajo de la imagen */
  .art-info { padding:12px 14px 14px; }
  .art-ref   { color:#60a5fa; font-size:13px; font-weight:800; letter-spacing:1px; margin-bottom:4px; }
  .art-nombre { color:#f9fafb; font-size:17px; font-weight:800; line-height:1.3; margin-bottom:8px; }
  .art-nombre.done { text-decoration:line-through; color:#4b5563; }
  .art-qty-row { display:flex; align-items:center; justify-content:space-between; }
  .art-qty {
    background:#2563eb; border-radius:10px;
    padding:7px 16px; font-weight:900; font-size:20px;
    color:#fff;
  }
  .art-card.done .art-qty { background:#374151; color:#6b7280; }

  .art-actions { display:flex; border-top:2px solid #374151; }
  .art-actions.done { border-color:#16a34a33; }
  .btn-tick-art {
    flex:1; padding:14px; border:none; cursor:pointer; font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:transparent; transition: background 0.15s;
  }
  .btn-tick-art.ticked { color:#16a34a; }
  .btn-tick-art:not(.ticked) { color:#9ca3af; }
  .btn-tick-art:active { background:#37415144; }
  .btn-bom {
    flex:1; padding:14px; border:none; border-left:2px solid #374151; cursor:pointer;
    background:transparent; color:#60a5fa; font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-bom:active { background:#37415144; }
  .art-card.done .btn-bom { border-left-color:#16a34a33; }

  /* PIEZA nivel 4 */
  .pieza-btn {
    background:#1f2937; border:2px solid #374151; border-radius:14px;
    padding:14px; text-align:left; cursor:pointer;
    display:flex; align-items:center; gap:12px; width:100%;
  }
  .pieza-btn.done { background:#052e1620; border-color:#15803d55; }
  .pieza-btn:active { opacity:0.6; }
  .pieza-img { width:56px; height:56px; border-radius:10px; object-fit:cover; background:#111827; flex-shrink:0; }
  .pieza-img-ph { width:56px; height:56px; border-radius:10px; background:#1f2937; border:2px solid #374151; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .pieza-ref  { color:#a78bfa; font-size:12px; font-weight:800; letter-spacing:1px; margin-bottom:3px; }
  .pieza-nombre { color:#f9fafb; font-size:15px; font-weight:700; line-height:1.3; }
  .pieza-nombre.done { text-decoration:line-through; color:#4b5563; }
  .pieza-loc  { color:#6b7280; font-size:12px; margin-top:3px; }
  .pieza-qty  { background:#7c3aed; border-radius:10px; padding:6px 12px; font-weight:900; font-size:18px; color:#fff; flex-shrink:0; min-width:46px; text-align:center; }
  .pieza-btn.done .pieza-qty { background:#374151; color:#6b7280; }

  /* TABS */
  .tabs { display:flex; gap:8px; padding:12px 12px 0; overflow-x:auto; }
  .tab-btn {
    background:#1f2937; border:2px solid #374151; border-radius:10px;
    padding:8px 16px; color:#9ca3af; font-weight:700; font-size:14px;
    cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .tab-btn.active { background:#2563eb22; border-color:#2563eb; color:#60a5fa; }
  .tab-btn.done-tab { border-color:#16a34a55; color:#4ade80; }
  .tab-btn.active.done-tab { background:#16a34a22; border-color:#16a34a; }

  .prod-img-header { width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0; }
  .bom-img-wrap { width:100%; height:200px; background:#111827; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .bom-img { max-width:100%; max-height:200px; object-fit:contain; display:block; }

  .empty { background:#1f2937; border:2px solid #374151; border-radius:14px; padding:32px; text-align:center; color:#6b7280; font-size:15px; }
  .error-box { background:#450a0a; border:2px solid #dc262655; border-radius:12px; padding:16px; color:#fca5a5; font-size:14px; }
  .spinner { text-align:center; padding:48px; color:#6b7280; font-size:16px; }

  .worker-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px 12px; }
  .worker-btn {
    background:#1f2937; border:2px solid #374151; border-radius:14px;
    padding:20px 12px; text-align:center; cursor:pointer;
    font-weight:800; font-size:17px; color:#fff;
  }
  .worker-btn:active { opacity:0.7; background:#374151; }
  .worker-icon { font-size:28px; margin-bottom:8px; }

  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#1f2937; border:2px solid #374151; border-radius:12px;
    padding:10px 20px; color:#9ca3af; font-size:14px; font-weight:600;
    z-index:100; opacity:0; transition:opacity 0.2s; pointer-events:none;
  }
  .toast.show { opacity:1; }
  .btn-pedido-listo { background:#15803d; border:none; border-radius:8px; padding:7px 13px; color:#fff; font-size:13px; font-weight:700; white-space:nowrap; cursor:pointer; }
  .btn-pedido-listo.preparado { background:#374151; color:#6b7280; }
  .btn-pedido-listo:active { opacity:0.7; }

  /* LOGIN */
  .pin-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; gap:28px; }
  .pin-dots { display:flex; gap:16px; align-items:center; justify-content:center; }
  .pin-dot { width:18px; height:18px; border-radius:50%; background:#374151; transition:background 0.12s; }
  .pin-dot.filled { background:#2563eb; }
  .pin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:280px; }
  .pin-key { background:#1f2937; border:2px solid #374151; border-radius:14px; padding:0; height:72px; font-size:22px; font-weight:800; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .pin-key:active { background:#374151; }
  .pin-key.del { font-size:18px; color:#9ca3af; }
  .pin-key.empty { background:transparent; border-color:transparent; cursor:default; }
  .pin-error { color:#fca5a5; font-size:14px; font-weight:700; min-height:20px; text-align:center; }
  .user-chip { display:flex; align-items:center; gap:8px; background:#1f2937; border:2px solid #374151; border-radius:10px; padding:6px 12px; font-size:13px; font-weight:700; color:#9ca3af; cursor:pointer; }
  .user-chip:active { opacity:0.7; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxB0GpIGHcOChaQJa0JF0frf9q159KUHY8HJ7hehyIgapI-_iEgmexWl-uvNFLPI0NtOw/exec";

const _proxyInFlight = new Set();

async function _doProxy(el, fileId, ref) {
  if (_proxyInFlight.has(fileId)) return;
  _proxyInFlight.add(fileId);
  try {
    const res = await scriptGet({accion:'getImageProxy', fileId});
    if (res.ok) {
      const dataUrl = `data:${res.mimeType};base64,${res.data}`;
      if (ref) {
        E.imagenesProductos[ref] = dataUrl;
        if (E.vista === 'articulos' || E.vista === 'bom') render();
      } else {
        el.src = dataUrl;
        el.style.display = 'block';
        if (el.nextElementSibling) el.nextElementSibling.style.display = 'none';
      }
    } else {
      if (el.nextElementSibling) el.nextElementSibling.style.display = 'flex';
    }
  } catch(e) {
    if (el.nextElementSibling) el.nextElementSibling.style.display = 'flex';
  } finally {
    _proxyInFlight.delete(fileId);
  }
}

async function proxyImg(el) {
  el.onerror = null;
  const m = (el.src || '').match(/[?&]id=([^&]+)/);
  if (!m) { if (el.nextElementSibling) el.nextElementSibling.style.display = 'flex'; return; }
  await _doProxy(el, m[1], el.dataset.ref || null);
}
const LISTAS = [
  { id:"69aadc2080478111fe2df02a", nombre:"JORDI",       icon:"👷" },
  { id:"69aadc14f4cf7f0517ae4881", nombre:"CANO",        icon:"👷" },
  { id:"69aadc1d001039d8d3d76820", nombre:"SATOCA",      icon:"👷" },
  { id:"69aadc24ea6a361f0a90f327", nombre:"CRISTOBAL",   icon:"👷" },
  { id:"69ca0f410fcd601433ba0459", nombre:"EDUARDO",     icon:"👷" },
  { id:"699e9657d250637a7c9db26c", nombre:"GASTÓN",      icon:"👷" },
  { id:"69aadc1a98d516206286ddeb", nombre:"CARRILLO",    icon:"👷" },
  { id:"69aadc2e89da1e8af0a3689f", nombre:"JOSE LUIS",   icon:"👷" },
  { id:"69aadc2cd0817bfe9ac9bfcb", nombre:"DAVID",       icon:"👷" },
  { id:"69aadc2f9bad3442ca2974ef", nombre:"MONTAJE",     icon:"🔧" },
  { id:"69b0054b03c85f298ed3363f", nombre:"SIN ASIGNAR", icon:"📋" },
];

const TABS = [
  { key:"bom",         label:"BOM" },
  { key:"tornilleria", label:"Tornillería" },
  { key:"calidad",     label:"Calidad" },
  { key:"otros",       label:"Otros" },
];

const TABS_POR_ROL = {
  almacen:  ["bom", "otros"],
  montador: ["tornilleria", "otros"],
  calidad:  ["calidad", "tornilleria"],
  admin:    ["bom", "tornilleria", "calidad", "otros"],
};
const TICK_POR_ROL = {
  almacen:  ["bom", "otros"],
  montador: ["tornilleria"],
  calidad:  ["calidad"],
  admin:    ["bom", "tornilleria", "calidad", "otros"],
};

const CAT_ARTICULO = "__articulo__";

let E = {
  vista: "login",
  usuario: null,           // { nombre, rol } — sesión activa
  _loginPin: "",
  _loginError: "",
  _loginLoading: false,
  listaActiva: null,
  pedidos: [],
  pedidoActivo: null,
  articulos: [],
  articuloActivo: null,
  bom: null,
  tabActiva: "bom",
  progreso: {},
  resumenWorker: {},
  imagenesProductos: {},
  attachments: [],
  loading: false,
  loadingBom: false,
  error: null,
};

// Restaurar sesión guardada
(function() {
  try {
    var saved = sessionStorage.getItem("picking_usuario");
    if (saved) { E.usuario = JSON.parse(saved); E.vista = "workers"; }
  } catch(e) {}
})();

// ---- HELPERS ----
function parsePedido(name) {
  const m = name.match(/^(\d+)\s*-\s*(.+)$/);
  if (m) return { num:m[1], sufijo:m[2].trim() };
  const n = name.match(/^(\d+)$/);
  if (n) return { num:n[1], sufijo:null };
  return { num:null, sufijo:name };
}
function parseItem(name) {
  // Captura el ref completo incluyendo variantes con guión (ej: MXT29-V7, no solo MXT29)
  const refM = name.match(/^([A-Z0-9]+(?:-[A-Z0-9]+)*(?:\([^)]+\))?)/);
  const ref  = refM ? refM[1] : null;
  const cantM= name.match(/[xX×](\d+)/);
  const cant = cantM ? parseInt(cantM[1]) : 1;
  // Quitar cantidad del final, luego quitar el prefijo del ref exacto
  const sinCant = name.replace(/\s*[—-]\s*[xX×]\d+$/i,"").trim();
  const refEsc  = ref ? ref.replace(/-/g,"\\-") : "[A-Z0-9]+(?:-[A-Z0-9]+)*";
  const nombre  = sinCant.replace(new RegExp("^"+refEsc+"\\s*[—\\-]\\s*","i"),"").trim();
  return { ref, nombre, cant };
}
function tKey(artRef, cat, pRef) { return artRef+"__"+cat+"__"+pRef; }
function artTickKey(artRef) { return tKey(artRef, CAT_ARTICULO, artRef); }

function badge(done, total) {
  if (total===0) return `<span class="badge badge-pend">SIN BOM</span>`;
  const p = Math.round(done/total*100);
  if (p===100) return `<span class="badge badge-listo">✓ LISTO</span>`;
  if (p>0)     return `<span class="badge badge-parcial">${p}%</span>`;
  return `<span class="badge badge-pend">PENDIENTE</span>`;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

function pr(pedidoId) { return E.progreso[pedidoId] || {}; }

function rolActual() { return (E.usuario && E.usuario.rol) || "admin"; }
function tabsVisibles() {
  const permitidas = TABS_POR_ROL[rolActual()] || TABS_POR_ROL.admin;
  return TABS.filter(t => permitidas.includes(t.key));
}
function puedeTickar(cat) {
  return (TICK_POR_ROL[rolActual()] || TICK_POR_ROL.admin).includes(cat);
}

function getPiezasDone(pedidoId, artRef, cat, piezas) {
  const p = pr(pedidoId);
  return piezas.filter(pieza => {
    const pRef = String(pieza.REFERENCIA||pieza.NOMBRE||"").trim();
    return p[tKey(artRef,cat,pRef)];
  }).length;
}

// ---- API ----
async function scriptGet(params) {
  const qs = Object.entries(params).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  const r = await fetch(SCRIPT_URL+"?"+qs);
  if (!r.ok) throw new Error("Script "+r.status);
  return r.json();
}
async function scriptPost(body) {
  const r = await fetch(SCRIPT_URL, {
    method:"POST", headers:{"Content-Type":"text/plain"}, // text/plain evita preflight CORS
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("Script POST "+r.status);
  return r.json();
}

// ---- CARGA ----
async function cargarPedidos(listaId) {
  try {
    const [pedidos, progRes] = await Promise.all([
      scriptGet({accion:'getCards', listaId}),
      scriptGet({accion:'getProgresoWorker', worker: E.listaActiva.nombre}).catch(()=>({resumen:{}}))
    ]);
    E.pedidos = pedidos;
    E.resumenWorker = progRes.resumen || {};
    E.loading = false;
  } catch(e) { E.error=e.message; E.loading=false; }
  render();
}

async function cargarAttachments(cardId) {
  try {
    const data = await scriptGet({accion:'getAttachments', cardId});
    E.attachments = data.pdfs || [];
  } catch(e) { E.attachments = []; }
  render();
}

async function cargarArticulos(cardId) {
  try {
    // Fase 1: checklists + progreso en una sola llamada al backend
    const data = await scriptGet({accion:"getCardData", cardId, pedidoId: E.pedidoActivo.id});
    const listas = data.checklists || [];
    const cl = listas.find(l=>l.name==="Artículos")||listas[0];
    E.articulos = cl ? cl.checkItems.map(i=>({...i, parsed:parseItem(i.name)})) : [];
    if (data.ticks) E.progreso[E.pedidoActivo.id] = data.ticks;
  } catch(e) { E.articulos=[]; }
  E.loading = false;
  render(); // render inmediato sin imágenes

  // Fase 2: todas las imágenes como data URLs en una sola llamada (sin proxy posterior)
  try {
    const refs = [...new Set(E.articulos.map(i=>i.parsed.ref).filter(Boolean))];
    if (refs.length) {
      const imgs = await scriptGet({accion:"getImagenesProxy", refs: JSON.stringify(refs)});
      if (imgs && !imgs.error) { Object.assign(E.imagenesProductos, imgs); render(); }
    }
  } catch(e) {}
}

async function cargarBOM(ref) {
  E.loadingBom = true; render();
  try {
    E.bom = await scriptGet({accion:"getBOM", ref});
    if (E.bom.imagenProducto) {
      E.imagenesProductos[ref] = E.bom.imagenProducto;
    }
  } catch(e) { E.bom={error:e.message}; }
  E.loadingBom = false; render();

  // Cargar imágenes de las piezas en segundo plano (no bloquea el render del BOM)
  try {
    const todosRefs = [];
    ['bom','tornilleria','calidad','otros'].forEach(cat => {
      (E.bom?.[cat]||[]).forEach(p => {
        const r = String(p.REFERENCIA||"").trim();
        if (r && !E.imagenesProductos[r]) todosRefs.push(r);
      });
    });
    const uniqueRefs = [...new Set(todosRefs)];
    if (uniqueRefs.length) {
      const imgs = await scriptGet({accion:"getImagenesProxy", refs: JSON.stringify(uniqueRefs)});
      if (imgs && !imgs.error) { Object.assign(E.imagenesProductos, imgs); render(); }
    }
  } catch(e2) {}
}

async function guardarTick(artRef, cat, pRef, tictado) {
  toast(tictado ? "✓ Guardando…" : "Guardando…");
  try {
    await scriptPost({
      accion:"guardarTick",
      pedidoId:    E.pedidoActivo.id,
      pedidoNombre:E.pedidoActivo.name,
      worker:      E.listaActiva.nombre,
      artRef, piezaRef:pRef, categoria:cat, tictado
    });
    toast(tictado ? "✓ Guardado" : "Desmarcado");
  } catch(e) { toast("⚠ Error al guardar"); }
}

async function handleLogin(pin) {
  E._loginLoading = true; render();
  try {
    const res = await scriptGet({ accion: "login", pin });
    if (res.ok) {
      E.usuario = { nombre: res.nombre, rol: res.rol };
      sessionStorage.setItem("picking_usuario", JSON.stringify(E.usuario));
      E.vista = "workers";
      E._loginPin = ""; E._loginError = ""; E._loginLoading = false;
    } else {
      E._loginPin = ""; E._loginError = "PIN incorrecto"; E._loginLoading = false;
    }
  } catch(e) {
    E._loginPin = ""; E._loginError = "Error de conexión"; E._loginLoading = false;
  }
  render();
}

function cerrarSesion() {
  sessionStorage.removeItem("picking_usuario");
  E.usuario = null; E.vista = "login"; E._loginPin = ""; E._loginError = "";
  render();
}

// ---- RENDER ----
function render() {
  const app = document.getElementById("app");
  switch(E.vista) {
    case "login":     app.innerHTML = renderLogin();     break;
    case "workers":   app.innerHTML = renderWorkers();   break;
    case "pedidos":   app.innerHTML = renderPedidos();   break;
    case "articulos": app.innerHTML = renderArticulos(); break;
    case "bom":       app.innerHTML = renderBOM();       break;
  }
  bindEvents();
}

function renderLogin() {
  const pin = E._loginPin || "";
  const dots = [0,1,2,3].map(i =>
    `<div class="pin-dot${i < pin.length ? " filled" : ""}"></div>`
  ).join("");
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  const keyBtns = keys.map(k => {
    if (k === "") return `<div class="pin-key empty"></div>`;
    return `<button class="pin-key${k==="⌫"?" del":""}" data-key="${k}">${k}</button>`;
  }).join("");
  return `
    <div class="pin-screen">
      <div style="text-align:center">
        <div style="font-size:52px;margin-bottom:14px">📦</div>
        <div style="font-size:22px;font-weight:900;color:#fff">ALMACÉN · PICKING</div>
        <div style="color:#9ca3af;font-size:15px;margin-top:6px">Introduce tu PIN</div>
      </div>
      <div class="pin-dots">${dots}</div>
      <div class="pin-error">${E._loginError || ""}</div>
      <div class="pin-grid">${keyBtns}</div>
      ${E._loginLoading ? `<div style="color:#6b7280;font-size:14px">Verificando…</div>` : ""}
    </div>`;
}

function renderWorkers() {
  const u = E.usuario;
  const rolLabel = { almacen:"Almacén", montador:"Montador", calidad:"Calidad", admin:"Admin" }[u?.rol] || u?.rol || "";
  return `
    <div class="header">
      <div class="header-row">
        <div class="header-icon">📦</div>
        <div style="flex:1"><div class="header-title">ALMACÉN · PICKING</div>
        <div class="header-sub">Selecciona trabajador</div></div>
        <button class="user-chip" id="btn-logout" title="Cerrar sesión">
          👤 ${u?.nombre || ""} <span style="color:#4b5563;font-size:11px">${rolLabel}</span>
        </button>
      </div>
    </div>
    <div class="worker-grid">
      ${LISTAS.map(l=>`
        <button class="worker-btn" data-lista="${l.id}" data-nombre="${l.nombre}">
          <div class="worker-icon">${l.icon}</div>${l.nombre}
        </button>`).join("")}
    </div>`;
}

function renderPedidos() {
  const {listaActiva,pedidos,loading,error} = E;
  let inner = "";
  if (loading) inner=`<div class="spinner">Cargando pedidos…</div>`;
  else if (error) inner=`<div class="error-box">⚠️ ${error}</div>`;
  else if (!pedidos.length) inner=`<div class="empty">No hay pedidos</div>`;
  else {
    const visibles   = pedidos.filter(p => !E.resumenWorker[p.id]?.preparado);
    const preparados = pedidos.filter(p =>  !!E.resumenWorker[p.id]?.preparado);

    const renderPedidoBtn = (p, dimmed) => {
      const summary = E.resumenWorker[p.id] || {};
      const p2 = pr(p.id);
      const done  = summary.done  ?? Object.values(p2).filter(Boolean).length;
      const total = summary.total ?? Object.keys(p2).length;
      const listo = total>0&&done===total;
      const {num,sufijo}=parsePedido(p.name);
      return `
        <button class="pedido-btn${dimmed?" listo":listo?" listo":""}" data-pedido="${p.id}" data-nombre="${p.name}"${dimmed?' style="opacity:0.45"':''}>
          <div class="pedido-icon">${dimmed?"✅":listo?"✅":"📋"}</div>
          <div style="flex:1;min-width:0">
            ${num?`<div class="pedido-num">Nº ${num}</div>`:""}
            <div class="pedido-name"${dimmed?' style="text-decoration:line-through;color:#4b5563"':''}>${sufijo||p.name}</div>
            ${total>0?`<div class="pedido-sub">${done}/${total} ticks</div>`:""}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
            ${dimmed?`<span class="badge badge-listo">✓ LISTO</span>`:badge(done,total)}
            <span style="color:#4b5563;font-size:22px">›</span>
          </div>
        </button>`;
    };

    if (!visibles.length && !preparados.length) inner=`<div class="empty">No hay pedidos</div>`;
    else {
      inner = visibles.map(p => renderPedidoBtn(p, false)).join("");
      if (preparados.length) {
        inner += `<div style="color:#4b5563;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:12px 4px 4px">PREPARADOS</div>`;
        inner += preparados.map(p => renderPedidoBtn(p, true)).join("");
      }
    }
  }
  const pendientes = (pedidos||[]).filter(p => !E.resumenWorker[p.id]?.preparado).length;
  return `
    <div class="header">
      <div class="header-row">
        <button class="btn-back" id="btn-back-workers">‹</button>
        <div style="flex:1">
          <div class="header-title">${listaActiva?.nombre}</div>
          <div class="header-sub">${pendientes} pedido${pendientes!==1?'s':''} pendiente${pendientes!==1?'s':''}</div>
        </div>
        <button class="btn-refresh" id="btn-reload-pedidos">↺ Actualizar</button>
      </div>
    </div>
    <div class="content">${inner}</div>`;
}

function renderArticulos() {
  const {pedidoActivo,articulos,loading} = E;
  const {num,sufijo} = parsePedido(pedidoActivo?.name||"");
  const pdfBtns = (E.attachments||[]).map(pdf =>
    `<button class="btn-pdf-proxy" data-url="${pdf.url.replace(/"/g,'&quot;')}" style="background:#dc2626;border-radius:8px;padding:7px 13px;color:#fff;border:none;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;cursor:pointer;">📄 ${pdf.nombre.replace(/\.pdf$/i,"")}</button>`
  ).join("");
  const esPedidoPreparado = !!E.resumenWorker[pedidoActivo?.id]?.preparado;
  const p2 = pr(pedidoActivo?.id);
  const totalTicks=Object.keys(p2).length, doneTicks=Object.values(p2).filter(Boolean).length;
  const pct=totalTicks?Math.round(doneTicks/totalTicks*100):0;

  let inner="";
  if (loading) inner=`<div class="spinner">Cargando artículos…</div>`;
  else if (!articulos.length) inner=`<div class="empty">Sin artículos en este pedido</div>`;
  else inner = articulos.map(item=>{
    const {ref,nombre,cant}=item.parsed;
    const artTicked = !!(p2[artTickKey(ref)]);
    const bomKeys = Object.keys(p2).filter(k=>k.startsWith(ref+"__")&&!k.includes(CAT_ARTICULO));
    const bomDone = bomKeys.filter(k=>p2[k]).length;
    const bomTotal= bomKeys.length;
    const isDone  = artTicked || (bomTotal>0&&bomDone===bomTotal);

    // Imagen del producto — desde caché si está disponible
    const imgUrl = E.imagenesProductos[ref];
    const isDriveThumbnail = imgUrl && imgUrl.startsWith('https://drive.google.com/thumbnail');
    const imgHtml = !imgUrl
      ? `<div class="art-prod-img-placeholder">📦</div>`
      : isDriveThumbnail
        ? `<img class="art-prod-img" src="" data-ref="${ref}" data-proxy="${imgUrl}" style="display:none"><div class="art-prod-img-placeholder">📦</div>`
        : `<img class="art-prod-img" src="${imgUrl}" data-ref="${ref}" style="display:none" onload="this.style.display='block';this.nextElementSibling.style.display='none'" onerror="proxyImg(this)"><div class="art-prod-img-placeholder">📦</div>`;

    return `
      <div class="art-card${isDone?" done":""}" data-ref="${ref}">
        <div class="art-img-wrap">
          ${imgHtml}
          ${isDone?`<div class="art-done-overlay">✓ PREPARADO</div>`:""}
        </div>
        <div class="art-info">
          ${ref?`<div class="art-ref">${ref}</div>`:""}
          <div class="art-nombre${isDone?" done":""}">${nombre}</div>
          <div class="art-qty-row">
            <div class="art-qty">×${cant}</div>
            ${bomTotal>0?badge(bomDone,bomTotal):""}
          </div>
        </div>
        <div class="art-actions${isDone?" done":""}">
          <button class="btn-tick-art${artTicked?" ticked":""}" data-ref="${ref}" data-nombre="${nombre.replace(/"/g,'&quot;')}">
            ${artTicked?"✓ PREPARADO":"○ Marcar preparado"}
          </button>
          <button class="btn-bom" data-ref="${ref}" data-nombre="${nombre.replace(/"/g,'&quot;')}" data-cant="${cant}">
            Ver BOM ›
          </button>
        </div>
      </div>`;
  }).join("");

  return `
    <div class="header">
      <div class="header-row" style="align-items:flex-start">
        <button class="btn-back" id="btn-back-pedidos" style="margin-top:4px">‹</button>
        <div style="flex:1">
          ${num?`<div class="pedido-num-big">Nº ${num}</div>`:""}
          ${sufijo?`<div class="pedido-semana-big">${sufijo}</div>`:""}
          <div class="header-sub" style="margin-top:6px">
            ${loading?"Cargando…":`${articulos.length} artículos · ${doneTicks}/${totalTicks} ticks`}
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap">
          ${pdfBtns}
          <button id="btn-pedido-listo" class="btn-pedido-listo${esPedidoPreparado?' preparado':''}">
            ${esPedidoPreparado?'✓ PREPARADO':'✓ Listo'}
          </button>
          <button class="btn-refresh" id="btn-reload-articulos">↺</button>
        </div>
      </div>
      ${totalTicks?`<div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;background:${pct===100?"#16a34a":"#2563eb"}"></div></div>`:""}
    </div>
    <div class="content grid-arts">${inner}</div>`;
}

function renderBOM() {
  const {articuloActivo,pedidoActivo,bom,loadingBom,tabActiva}=E;
  const ref=articuloActivo?.ref||"", nombre=articuloActivo?.nombre||"", cant=articuloActivo?.cant||1;

  const tabs = tabsVisibles().map(t=>{
    const piezas=bom?(bom[t.key]||[]):[];
    const done=getPiezasDone(pedidoActivo.id,ref,t.key,piezas);
    const total=piezas.length;
    const isDone=total>0&&done===total;
    return `<button class="tab-btn${tabActiva===t.key?" active":""}${isDone?" done-tab":""}" data-tab="${t.key}">
      ${t.label}${total>0?` ${done}/${total}`:""}
    </button>`;
  }).join("");

  let inner="";
  if (loadingBom) inner=`<div class="spinner">Cargando BOM…</div>`;
  else if (!bom)  inner=`<div class="spinner">Iniciando…</div>`;
  else if (bom.error) inner=`<div class="error-box">⚠️ ${bom.error}</div>`;
  else {
    const piezas=bom[tabActiva]||[];
    if (!piezas.length) inner=`<div class="empty">Sin piezas en esta categoría</div>`;
    else inner=piezas.map((p,idx)=>{
      const pRef=String(p.REFERENCIA||"").trim();
      const pNombre=String(p.NOMBRE||"").trim();
      const pCant=p.CANTIDAD||1;
      const pLoc=String(p["LOCALIZACIÓN"]||"").trim();
      const pId=pRef||pNombre||String(idx);
      const isDone=!!(pr(pedidoActivo.id)[tKey(ref,tabActiva,pId)]);

      const pImgUrl = pRef ? E.imagenesProductos[pRef] : null;
      const pIsDriveThumb = pImgUrl && pImgUrl.startsWith('https://drive.google.com/thumbnail');
      const imgHtml = !pImgUrl
        ? `<div class="art-prod-img-placeholder" style="font-size:40px">🔩</div>`
        : pIsDriveThumb
          ? `<img class="art-prod-img" src="" data-ref="${pRef}" data-proxy="${pImgUrl}" style="display:none"><div class="art-prod-img-placeholder" style="font-size:40px">🔩</div>`
          : `<img class="art-prod-img" src="${pImgUrl}" style="display:block">`;

      return `
        <div class="art-card${isDone?" done":""}">
          <div class="art-img-wrap">
            ${imgHtml}
            ${isDone?`<div class="art-done-overlay">✓ LISTO</div>`:""}
          </div>
          <div class="art-info">
            ${pRef?`<div class="art-ref" style="color:#a78bfa">${pRef}</div>`:""}
            <div class="art-nombre${isDone?" done":""}">${pNombre||"Sin nombre"}</div>
            <div class="art-qty-row">
              <div class="art-qty" style="background:#7c3aed">×${pCant}</div>
            </div>
            ${pLoc?`<div style="color:#6b7280;font-size:12px;margin-top:6px">📍 ${pLoc}</div>`:""}
          </div>
          <div class="art-actions${isDone?" done":""}">
            ${puedeTickar(tabActiva)
              ? `<button class="btn-tick-art pieza-btn${isDone?" ticked":""}" data-pref="${pRef}" data-pnombre="${pNombre.replace(/"/g,'&quot;')}" data-pidx="${idx}">
                  ${isDone?"✓ LISTO":"○ Marcar listo"}
                 </button>`
              : `<div style="padding:14px;color:#4b5563;font-size:13px;text-align:center;width:100%">Solo lectura</div>`}
          </div>
        </div>`;
    }).join("");
  }

  let aDone=0,aTotal=0;
  if (bom && !bom.error) {
    tabsVisibles().forEach(t=>{
      const piezas=bom[t.key]||[];
      aTotal+=piezas.length;
      aDone+=getPiezasDone(pedidoActivo.id,ref,t.key,piezas);
    });
  }
  const aPct=aTotal?Math.round(aDone/aTotal*100):0;
  const imgProd=E.imagenesProductos[ref] || bom?.imagenProducto;

  return `
    <div class="header">
      <div class="header-row" style="align-items:flex-start">
        <button class="btn-back" id="btn-back-articulos" style="margin-top:4px">‹</button>
        <div style="flex:1">
          ${ref?`<div class="art-ref" style="font-size:15px;margin-bottom:4px">${ref}</div>`:""}
          <div style="color:#fff;font-weight:800;font-size:17px;line-height:1.3">${nombre}</div>
          <div class="header-sub" style="margin-top:4px">×${cant} uds · ${aDone}/${aTotal} piezas</div>
        </div>
      </div>
      ${aTotal?`<div class="progress-wrap"><div class="progress-bar" style="width:${aPct}%;background:${aPct===100?"#16a34a":"#2563eb"}"></div></div>`:""}
    </div>
    <div class="bom-img-wrap">${
      loadingBom
        ? `<div style="color:#6b7280;font-size:14px">Cargando imagen…</div>`
        : imgProd
          ? (imgProd.startsWith('https://drive.google.com/thumbnail')
              ? `<img class="bom-img" src="" data-ref="${ref}" data-proxy="${imgProd}" style="display:none"><div class="art-prod-img-placeholder" style="font-size:28px;color:#4b5563">Cargando…</div>`
              : `<img class="bom-img" src="${imgProd}" style="display:block">`)
          : `<div style="color:#4b5563;font-size:14px">Sin imagen</div>`
    }</div>
    <div class="tabs">${tabs}</div>
    <div class="content grid-arts">${inner}</div>`;
}

// ---- EVENTOS ----
function bindEvents() {
  // Login keypad
  document.querySelectorAll(".pin-key").forEach(btn => btn.addEventListener("click", () => {
    if (E._loginLoading) return;
    const key = btn.dataset.key;
    if (key === "⌫") {
      E._loginPin = (E._loginPin || "").slice(0, -1);
      E._loginError = "";
    } else {
      E._loginPin = ((E._loginPin || "") + key).slice(0, 4);
      E._loginError = "";
      if (E._loginPin.length === 4) handleLogin(E._loginPin);
    }
    render();
  }));
  document.getElementById("btn-logout")?.addEventListener("click", cerrarSesion);

  // Drive thumbnails: proxy directo, sin intento previo de carga (evita ORB)
  document.querySelectorAll('img[data-proxy]').forEach(el => {
    const m = el.dataset.proxy.match(/[?&]id=([^&]+)/);
    if (m) _doProxy(el, m[1], el.dataset.ref || null);
  });

  document.querySelectorAll(".worker-btn").forEach(btn=>btn.addEventListener("click",()=>{
    E.listaActiva={id:btn.dataset.lista,nombre:btn.dataset.nombre};
    E.vista="pedidos"; E.pedidos=[]; E.error=null; E.loading=true;
    render(); cargarPedidos(btn.dataset.lista);
  }));

  document.getElementById("btn-back-workers")?.addEventListener("click",()=>{E.vista="workers";render();});
  document.getElementById("btn-reload-pedidos")?.addEventListener("click",()=>{E.loading=true;E.error=null;E.resumenWorker={};render();cargarPedidos(E.listaActiva.id);});

  document.querySelectorAll(".pedido-btn").forEach(btn=>btn.addEventListener("click",()=>{
    E.pedidoActivo={id:btn.dataset.pedido,name:btn.dataset.nombre};
    E.vista="articulos"; E.articulos=[]; E.loading=true; E.attachments=[];
    render(); cargarArticulos(btn.dataset.pedido); cargarAttachments(btn.dataset.pedido);
  }));

  document.getElementById("btn-back-pedidos")?.addEventListener("click",()=>{E.vista="pedidos";render();});
  document.getElementById("btn-reload-articulos")?.addEventListener("click",()=>{
    E.attachments=[];
    E.articulos=[]; E.loading=true; E.imagenesProductos={};
    render(); cargarArticulos(E.pedidoActivo.id); cargarAttachments(E.pedidoActivo.id);
  });

  document.getElementById("btn-pedido-listo")?.addEventListener("click", async function() {
    const pedidoId = E.pedidoActivo.id;
    const nuevoEstado = !E.resumenWorker[pedidoId]?.preparado;
    if (!E.resumenWorker[pedidoId]) E.resumenWorker[pedidoId] = {total:0, done:0, preparado:false};
    E.resumenWorker[pedidoId].preparado = nuevoEstado;
    scriptPost({
      accion:"guardarTick",
      pedidoId, pedidoNombre: E.pedidoActivo.name,
      worker: E.listaActiva.nombre,
      artRef:"__PEDIDO__", piezaRef:"__PREPARADO__", categoria:"__PEDIDO__",
      tictado: nuevoEstado
    }).catch(()=>toast("⚠ Error al guardar"));
    toast(nuevoEstado ? "✓ Pedido PREPARADO" : "Pedido desmarcado");
    render();
  });

  document.querySelectorAll(".btn-tick-art").forEach(btn=>btn.addEventListener("click",e=>{
    e.stopPropagation();
    const ref=btn.dataset.ref, nombre=btn.dataset.nombre;
    const pedidoId=E.pedidoActivo.id;
    if (!E.progreso[pedidoId]) E.progreso[pedidoId]={};
    const key=artTickKey(ref);
    const nuevo=!E.progreso[pedidoId][key];
    E.progreso[pedidoId][key]=nuevo;
    render();
    guardarTick(ref, CAT_ARTICULO, ref, nuevo);
  }));

  document.querySelectorAll(".btn-bom").forEach(btn=>btn.addEventListener("click",e=>{
    e.stopPropagation();
    E.articuloActivo={ref:btn.dataset.ref,nombre:btn.dataset.nombre,cant:parseInt(btn.dataset.cant)||1};
    const tv=tabsVisibles();
    E.vista="bom"; E.bom=null; E.tabActiva=tv.length?tv[0].key:"bom";
    render(); cargarBOM(btn.dataset.ref);
  }));

  document.getElementById("btn-back-articulos")?.addEventListener("click",()=>{E.vista="articulos";render();});

  document.querySelectorAll(".tab-btn").forEach(btn=>btn.addEventListener("click",()=>{
    E.tabActiva=btn.dataset.tab; render();
  }));

  document.querySelectorAll(".btn-pdf-proxy").forEach(btn=>btn.addEventListener("click", async function() {
    const orig = btn.innerHTML;
    btn.innerHTML = "⏳ Cargando…"; btn.disabled = true;
    try {
      const res = await scriptGet({accion:"getPdfProxy", url:btn.dataset.url});
      if (res.error) throw new Error(res.error);
      const bytes = Uint8Array.from(atob(res.data), c => c.charCodeAt(0));
      window.open(URL.createObjectURL(new Blob([bytes], {type:"application/pdf"})), "_blank");
    } catch(e) {
      toast("Error PDF: " + e.message);
    }
    finally { btn.innerHTML = orig; btn.disabled = false; }
  }));

  document.querySelectorAll(".pieza-btn").forEach(btn=>btn.addEventListener("click",()=>{
    const ref=E.articuloActivo.ref;
    const pRef=btn.dataset.pref, pNombre=btn.dataset.pnombre, idx=btn.dataset.pidx;
    const cat=E.tabActiva;
    const pId=pRef||pNombre||String(idx);
    const key=tKey(ref,cat,pId);
    const pedidoId=E.pedidoActivo.id;
    if (!E.progreso[pedidoId]) E.progreso[pedidoId]={};
    const nuevo=!E.progreso[pedidoId][key];
    E.progreso[pedidoId][key]=nuevo;
    render();
    guardarTick(ref,cat,pId,nuevo);
  }));
}

render();
</script>
</body>
</html>
